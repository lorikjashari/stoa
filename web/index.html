  <dl class="tb-cell"><dt>Register</dt><dd id="tb-drawings">—</dd></dl>
  <dl class="tb-cell"><dt>Stoa questions</dt><dd id="tb-questions">—</dd></dl>
  <dl class="tb-cell"><dt>Reader model</dt><dd id="tb-model">—</dd></dl>
  <span class="tb-fill"></span>
  <dl class="tb-cell tb-session"><dt>This session</dt><dd id="meter"></dd></dl>
  <button class="tb-btn" id="open-bench">Test report<svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="M2 10 10 2M4 2h6v6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
</header>

<main class="desk">
  <nav class="reg" aria-label="Drawing register">
    <div class="pane-head"><h2>Drawing register</h2><span id="reg-count"></span></div>
    <div class="reg-tools">
      <label class="find"><span class="sr">Find a sheet</span>
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 4 4" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="search" type="search" placeholder="Find a sheet…" autocomplete="off" spellcheck="false"></label>
      <div class="srcs" id="sources" role="group" aria-label="Source"></div>
      <label class="tick"><input type="checkbox" id="only-q" checked><span aria-hidden="true"></span>Only sheets with Stoa questions</label>
      <div class="demo"><span class="lbl">Demo set — one of each kind</span><div id="demo"></div></div>
    </div>
    <div class="rows" id="list"></div>
  </nav>

  <section class="board" aria-label="Drawing">
    <header class="board-bar">
      <div class="sheet-id"><span class="lbl">Sheet</span><h1 id="d-title">—</h1><p id="d-meta"></p></div>
      <div class="tools">
        <select id="sheet-select" class="hidden" aria-label="Sheet of this drawing"></select>
        <div class="seg" id="view-seg"><button data-view="sheet" class="on">Sheet</button><button data-view="3d" id="btn-3d">3D model</button></div>
        <div class="zoom"><button id="z-out" aria-label="Zoom out">−</button><output id="z-val">100%</output><button id="z-in" aria-label="Zoom in">+</button><button id="z-fit">Fit</button></div>
      </div>
    </header>
    <div class="stage" id="stage">
      <div class="canvas" id="canvas"></div>
      <iframe id="three" class="hidden" title="3D model"></iframe>
      <div class="stage-msg" id="stage-msg" aria-live="polite"></div>
      <div class="stepper hidden" id="stepper">
        <button id="st-prev" aria-label="Previous item">←</button><output id="st-label"></output><button id="st-next" aria-label="Next item">→</button><button id="st-all">All</button>
      </div>
    </div>
    <footer class="credit"><span class="lbl">Credit</span><p id="credit"></p></footer>
  </section>

  <aside class="chk" aria-label="Check sheet">
    <div class="pane-head"><h2>Check sheet</h2><span>Geometry first · a model only when needed</span></div>
    <form class="ask" id="ask">
      <label class="lbl" for="q">Question</label>
      <textarea id="q" rows="2" placeholder="Ask in any language — How many doors? Wie gross ist Wohnung A?"></textarea>
      <div class="ask-row">
        <button type="button" class="btn sq" id="mic" aria-label="Ask by voice"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="5.5" y="1" width="5" height="9" rx="2.5" fill="currentColor"/><path d="M3 8a5 5 0 0 0 10 0M8 13v2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
        <span class="keys"><kbd>/</kbd> focus <kbd>↵</kbd> ask <kbd>←</kbd><kbd>→</kbd> step evidence</span>
        <button class="btn solid" id="send">Ask</button>
      </div>
    </form>
    <section class="std" aria-label="Suggested questions">
      <div class="tabs"><button id="tab-stoa" class="on">Stoa's questions <i id="q-count"></i></button><button id="tab-free">Free-form</button></div>
      <ol class="qlist" id="suggest"></ol>
    </section>
    <div class="recs" id="thread" aria-live="polite"></div>
  </aside>
</main>

<dialog class="report" id="bench" aria-labelledby="bench-title">
  <header><div><span class="lbl">Test report</span><h2 id="bench-title">Measured on Stoa's question set</h2></div><button class="btn" id="close-bench">Close</button></header>
  <div id="bench-body"></div>
</dialog>
<div id="tip" class="tip hidden" role="tooltip"></div>
<script type="module" src="/web/app.js"></script>
</body>
</html>
