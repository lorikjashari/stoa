[project]
name = "stoa-qa"
version = "0.1.0"
description = "Make Blueprints Talk: verifiable Q&A over construction drawings and BIM"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ezdxf>=1.3",
  "shapely>=2.0",
  "ifcopenshell>=0.8",
  "pymupdf>=1.24",
  "numpy",
  "pillow",
  "python-dotenv",
  "fastapi>=0.162.7",
  "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Raster plans with the pretrained CubiCasa5K network (blueprint3d/cubicasa_model.py): uv sync --extra raster
raster = [
  "torch>=2.4",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
  "scikit-image>=0.24",
]
# The trained YOLO11 plan detectors run live on new / uploaded plans (stoa_qa/cubicasa_live.py): uv sync --extra detect
# Weights are not in git: third_party/weights/<run>.pt (see that module's docstring).
detect = [
  "ultralytics>=8.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "modal>=1.6.4",
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["stoa_qa"]
