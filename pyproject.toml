[project]
name = "stoa-qa"
version = "0.1.0"
description = "Make Blueprints Talk: verifiable Q&A over construction drawings and BIM"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ezdxf>=1.3",
  "shapely>=2.0",
  "ifcopenshell>=0.8",
  "pymupdf>=1.24",
  "numpy",
  "pillow",
  "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stoa_qa"]
